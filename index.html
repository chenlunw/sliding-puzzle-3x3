<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数字华容道 3×3</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #fff3e0, #ffe0c2 60%, #ffd3b4);
    color: #7a4a2a;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 26px;
    letter-spacing: 2px;
    color: #e07b39;
  }
  .tip { margin: 0 0 18px; font-size: 13px; color: #b98a6c; }

  .hud {
    display: flex;
    gap: 26px;
    margin-bottom: 18px;
    font-size: 15px;
    color: #a06a44;
  }
  .hud span { font-weight: 700; color: #e07b39; }

  .board {
    position: relative;
    width: 292px;
    height: 292px;
    padding: 10px;
    background: rgba(255,255,255,.55);
    border: 2px solid #f4c79c;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(200, 120, 60, .18);
  }

  .block {
    position: absolute;
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(160deg, #ffb067, #f58a2e);
    border: none;
    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(200, 100, 30, .28), inset 0 -2px 0 rgba(0,0,0,.12);
    cursor: pointer;
    transition: transform .16s ease;
  }
  .block:active { filter: brightness(1.06); }

  .actions {
    margin-top: 22px;
    display: flex;
    gap: 12px;
  }
  .actions button {
    padding: 10px 22px;
    font-size: 15px;
    color: #fff;
    background: linear-gradient(180deg, #ffa95c, #f0791f);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(220, 120, 50, .25);
  }
  .actions button.ghost {
    background: rgba(255,255,255,.7);
    color: #b26a3a;
    border: 1px solid #f2cfa8;
  }

  .mask {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(120, 70, 30, .3);
  }
  .mask.show { display: flex; }
  .card {
    text-align: center;
    padding: 30px 30px 24px;
    background: #fffdf7;
    border-radius: 22px;
    box-shadow: 0 12px 40px rgba(120,60,20,.25);
    animation: pop .3s ease;
  }
  @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .card .emoji { font-size: 46px; }
  .card .title { margin: 12px 0 6px; font-size: 22px; font-weight: 800; color: #e07b39; }
  .card .info { margin: 0 0 20px; font-size: 15px; color: #9a6b4a; }
  .card button {
    padding: 10px 26px;
    font-size: 15px;
    color: #fff;
    background: linear-gradient(180deg, #ffa94d, #f58a2e);
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>数字华容道 3×3</h1>
  <p class="tip">点击数字，让它滑到空格处，还原成 1～8 顺序即胜利</p>

  <div class="hud">
    <div>步数：<span id="steps">0</span></div>
    <div>用时：<span id="time">0</span> 秒</div>
  </div>

  <div class="board" id="board"></div>

  <div class="actions">
    <button id="shuffleBtn">打乱</button>
    <button class="ghost" id="resetBtn">还原重来</button>
  </div>

  <div class="mask" id="mask">
    <div class="card">
      <div class="emoji">🎉</div>
      <div class="title">恭喜完成！</div>
      <p class="info" id="resultInfo"></p>
      <button onclick="newGame()">再来一局</button>
    </div>
  </div>

<script>
  const GOAL = "1,2,3,4,5,6,7,8,0";
  const boardEl = document.getElementById("board");
  const stepsEl = document.getElementById("steps");
  const timeEl = document.getElementById("time");
  const maskEl = document.getElementById("mask");
  const resultInfo = document.getElementById("resultInfo");

  let board = [1, 2, 3, 4, 5, 6, 7, 8, 0];
  let blocks = {};
  let steps = 0;
  let seconds = 0;
  let timer = null;
  let started = false;

  // 初始化按钮块，方块尺寸 84 + 间距 8，块中心对齐到 cell
  const SIZE = 3;
  const CELL = 92; // 84 + 8
  function createBlocks() {
    boardEl.innerHTML = "";
    for (let n = 1; n <= 8; n++) {
      const b = document.createElement("button");
      b.className = "block";
      b.textContent = n;
      b.setAttribute("aria-label", "数字 " + n);
      b.addEventListener("click", () => move(n));
      boardEl.appendChild(b);
      blocks[n] = b;
    }
  }

  function posToXY(idx) {
    return {
      x: (idx % SIZE) * CELL,
      y: Math.floor(idx / SIZE) * CELL
    };
  }

  function render() {
    board.forEach((num, idx) => {
      if (num === 0) return;
      const { x, y } = posToXY(idx);
      blocks[num].style.transform = "translate(" + x + "px," + y + "px)";
    });
    if (started && board.join(",") === GOAL) win();
  }

  function move(n) {
    const idxN = board.indexOf(n);
    const idx0 = board.indexOf(0);
    const rn = Math.floor(idxN / SIZE), cn = idxN % SIZE;
    const r0 = Math.floor(idx0 / SIZE), c0 = idx0 % SIZE;
    if (Math.abs(rn - r0) + Math.abs(cn - c0) !== 1) return; // 不相邻

    board[idx0] = n;
    board[idxN] = 0;
    steps++;
    stepsEl.textContent = steps;
    if (!started) startTimer();
    render();
  }

  function getNeighbors(empty) {
    const r = Math.floor(empty / SIZE), c = empty % SIZE;
    const res = [];
    if (r > 0) res.push(empty - SIZE);
    if (r < SIZE - 1) res.push(empty + SIZE);
    if (c > 0) res.push(empty - 1);
    if (c < SIZE - 1) res.push(empty + 1);
    return res;
  }

  function shuffle() {
    stopTimer();
    steps = 0;
    seconds = 0;
    started = false;
    stepsEl.textContent = "0";
    timeEl.textContent = "0";
    // 从目标态出发随机走若干步，保证一定有解
    for (let k = 0; k < 240; k++) {
      const empty = board.indexOf(0);
      const neighbors = getNeighbors(empty);
      const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
      board[empty] = board[pick];
      board[pick] = 0;
    }
    render();
  }

  function startTimer() {
    started = true;
    timer = setInterval(() => {
      seconds++;
      timeEl.textContent = seconds;
    }, 1000);
  }

  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function win() {
    started = false;
    stopTimer();
    resultInfo.textContent = "你用 " + steps + " 步、花了 " + seconds + " 秒完成";
    maskEl.classList.add("show");
  }

  function newGame() {
    maskEl.classList.remove("show");
    shuffle();
  }

  document.getElementById("shuffleBtn").addEventListener("click", shuffle);
  document.getElementById("resetBtn").addEventListener("click", () => {
    board = [1, 2, 3, 4, 5, 6, 7, 8, 0];
    render();
    stopTimer();
    steps = 0; seconds = 0; started = false;
    stepsEl.textContent = "0"; timeEl.textContent = "0";
  });
  maskEl.addEventListener("click", (e) => { if (e.target === maskEl) maskEl.classList.remove("show"); });

  createBlocks();
  shuffle();
</script>
</body>
</html>
